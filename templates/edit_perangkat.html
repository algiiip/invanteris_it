<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="widht=device-width, initial-scale1.0">

    <title>Edit Perangkat</title>

    <link  
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>
    <nav class="navbar navbar-white bg-white">
        <div class="container">
            
            <a class="navbar-brand" href="/">
                Inventaris IT
            </a>
            
            <a href="/perangkat" class="btn btn-outline-light">
                Kembali
            </a>
                
        </div>

    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">Edit Perangkat</h4>
            </div>

            <div class="card-body">

                <form method="POST">
                    <div class="mb-3">

                        <label class="from-label">
                            Kode Aset
                        </label>

                        <input
                            type="text"
                            name="kode_aset"
                            class="form_control"
                            value="{{ perangkat[1] }}"
                            required
                        >
                        
                    </div>

                    <div class="mb-3">

                        <label class="from-label">
                            Nama Perangakt
                        </label>

                        <input
                            type="text"
                            name="nama_perangkat"
                            class="form_control"
                            value="{{ perangkat[2] }}"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="from-label">
                            Kategori
                        </label>

                        <select
                            name="kategori"
                            class="from-select"
                            required
                        >
                            <option value="Laptop"
                                {% if perangkat[3] == "Laptop" %}selected{% endif %}>
                                Laptop
                            </option>

                            <option value="Komputer"
                                {% if perangkat[3] == "Komputer" %}selected{% endif %}>
                                Komputer
                            </option>

                            <option value="Printer"
                                {% if perangkat[3] == "Printer" %}selected{% endif %}>
                                Printer
                            </option>

                            <option value="Monitor"
                                {% if perangkat[3] == "Monitor" %}selected{% endif %}>
                                Monitor
                            </option>

                            <option value="Router"
                                {% if perangkat[3] == "Router" %}selected{% endif %}>
                                Router
                            </option>

                            <option value="PC"
                                {% if perangkat[3] == "PC" %}selected{% endif %}>
                                PC
                            </option>

                            <option value="Switch"
                                {% if perangkat[3] == "Switch" %}selected{% endif %}>
                                Switch
                            </option>

                            <option value="Lainnya"
                                {% if perangkat[3] == "Lainnya" %}selected{% endif %}>
                                Lainnya
                            </option>

                        </select>

                    </div>
                    
                    <div class="mb-3">
                        <label class="from-label">
                            Merek
                        </label>

                        <input
                            type="text"
                            name="merek"
                            class="form_control"
                            value="{{ perangkat[4] or '' }}"
                        >

                    </div>

                    <div class="mb-3">
                        <label class="from-label">
                            Lokasi
                        </label>

                        <input
                            type="text"
                            name="lokasi"
                            class="form_control"
                            value="{{ perangkat[5] or '' }}"
                        >

                    </div>
                    
                    <div class="mb-3">
                        <label class="from-label">
                            Kondisi
                        </label>

                        <select
                            name="kondisi"
                            class="from-select"
                            required
                        >
                            
                        <option value="Baik"
                            {% if perangkat[6] == "Baik" %}selected{% endif %}>
                            Baik
                        </option>

                        <option value="Dalam Perbaikan"
                            {% if perangkat[6] == "Dalam Perabaikan" %}selected{% endif %}>
                            Dalam Perbaikan
                        </option>

                        <option value="Rusak"
                            {% if perangkat[6] == "Rusak" %}selected{% endif %}>
                            Rusak
                        </option>

                        </select>

                    </div>

                    <div class="mb-3">
                        <label class="from-label">
                            Tanggal Masuk
                        </label>

                        <input
                            type="date"
                            name="tanggal_masuk"
                            class="form_control"
                            value="{{ perangkat[7] }}"
                        >

                    </div>

                    <div class="mb-3">
                        <label class="from-label">
                            Keterangan
                        </label>

                        <textarea
                            name="keterangan"
                            class="form_control"
                            rows="3"
                        >{{ perangkat[8] or '' }}</textarea>

                    </div>

                    <div class="d-flex gap-2">

                        <a
                            href="/perangkat"
                            class="btn btn-secondary"
                        >
                            Batal
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Simpan Perubahan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
