<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - IT Inventory</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd 0%,
                    #4f46e5 50%,
                    #6f42c1 100%
                );

            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);
        }

        .login-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #e7f0ff;

            border-radius: 50%;

            font-size: 36px;
        }

        .login-title {
            text-align: center;

            font-size: 28px;
            font-weight: 700;

            color: #212529;

            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;

            color: #6c757d;

            margin-bottom: 30px;
        }

        .form-label {
            font-weight: 600;

            color: #343a40;

            margin-bottom: 8px;
        }

        .form-control {
            height: 48px;

            border-radius: 10px;

            border: 1px solid #dee2e6;

            padding-left: 15px;
        }

        .form-control:focus {
            border-color: #0d6efd;

            box-shadow:
                0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .btn-login {
            height: 48px;

            border: none;

            border-radius: 10px;

            font-weight: 600;

            font-size: 16px;

            background: #0d6efd;

            transition: 0.2s;
        }

        .btn-login:hover {
            background: #0b5ed7;

            transform: translateY(-1px);
        }

        .login-footer {
            text-align: center;

            color: #adb5bd;

            font-size: 13px;

            margin-top: 25px;
        }

        .alert {
            border-radius: 10px;

            font-size: 14px;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 30px 25px;
            }

            .login-title {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- ICON -->

        <div class="login-icon">
            💻
        </div>


        <!-- TITLE -->

        <div class="login-title">
            IT Inventaris
        </div>

        <div class="login-subtitle">
            Sistem Informasi Inventaris IT
        </div>


        <!-- ERROR -->

        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <!-- FORM -->

        <form method="POST">

            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary btn-login w-100"
            >
                Login
            </button>

        </form>


        <!-- FOOTER -->

        <div class="login-footer">
            © 2026 IT Inventory
        </div>

    </div>

</div>

</body>

</html>
