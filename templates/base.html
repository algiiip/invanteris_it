<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Inventaris IT{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f5f7fb;
            margin: 0;
        }

        /* SIDEBAR */

.sidebar {
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #0d6efd 0%,
            #4f46e5 50%,
            #6f42c1 100%
        );

    padding: 20px 15px;
}


/* JUDUL SIDEBAR */

.sidebar-title {
    color: #ffffff;
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 30px;
    padding-left: 10px;
}


/* MENU */

.sidebar-menu {
    margin-bottom: 10px;
}


/* TEXT MENU */

.sidebar-menu a {
    color: #ffffff;
    text-decoration: none;
    display: block;
    padding: 12px 15px;
    border-radius: 8px;
    transition: all 0.2s ease;
    font-size: 20 px;
    font-weight: 500;
}


/* HOVER */

.sidebar-menu a:hover {
    background-color: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    transform: translateX(3px);
}


/* MENU AKTIF */

.sidebar-menu a.active {
    background-color: rgba(255, 255, 255, 0.25);
    color: #ffffff;
    font-weight: 600;
}


/* ICON */

.menu-icon {
    width: 28px;
    display: inline-block;
    font-size: 16px;
}

        /* ICON */
        .menu-icon {
            width: 25px;
            display: inline-block;
        }

        /* CONTENT */
        .content {
            padding: 30px;
            min-height: 100vh;
        }

        /* CARD */
        .stat-card {
            border: none;
            border-radius: 12px;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            transition: 0.2s;
        }

        /* CHART */
        .chart-container {
            position: relative;
            height: 350px;
        }

        /* TABLE */
        .table {
            vertical-align: middle;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .sidebar {
                min-height: auto;
            }

            .content {
                padding: 15px;
            }

        }

    </style>

    {% block head %}
    {% endblock %}

</head>


<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-md-2 sidebar">

            <div class="sidebar-title">
                Inventaris IT
            </div>


            <div class="sidebar-menu">

                <a href="/">
                    <span class="menu-icon">🏠</span>
                    Dashboard
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat">
                    <span class="menu-icon">💻</span>
                    Data Perangkat
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat/tambah">
                    <span class="menu-icon">➕</span>
                    Tambah Perangkat
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat/cetak">
                    <span class="menu-icon">🖨️</span>
                    Cetak Laporan
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat/export">
                    <span class="menu-icon">📊</span>
                    Export Excel
                </a>

            </div>


            <!-- LOGOUT -->

            <div class="sidebar-menu">

                <a href="/logout">
                    <span class="menu-icon">🚪</span>
                    Logout
                </a>

            </div>

        </div>


        <!-- CONTENT -->

        <div class="col-md-10 content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>


<!-- SCRIPT -->

{% block script %}
{% endblock %}


</body>

</html>
