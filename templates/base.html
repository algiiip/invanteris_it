<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Inventaris IT{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        /* ==============================
           GLOBAL
        ============================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
            color: #172033;
        }


        /* ==============================
           SIDEBAR
        ============================== */

        .sidebar {
            min-height: 100vh;

            background:
                linear-gradient(
                    160deg,
                    #2563eb 0%,
                    #4338ca 50%,
                    #6d28d9 100%
                );

            padding: 24px 16px;

            position: sticky;
            top: 0;

            box-shadow:
                5px 0 25px rgba(31, 41, 55, 0.12);

            z-index: 100;
        }


        /* ==============================
           SIDEBAR TITLE
        ============================== */

        .sidebar-title {
            color: #ffffff;

            font-size: 24px;
            font-weight: 700;

            padding: 5px 12px 28px;

            letter-spacing: -0.4px;
        }

        .sidebar-subtitle {
            color: rgba(255, 255, 255, 0.65);

            font-size: 12px;
            font-weight: 500;

            padding-left: 12px;

            margin-top: -20px;
            margin-bottom: 25px;

            text-transform: uppercase;
            letter-spacing: 1px;
        }


        /* ==============================
           SIDEBAR MENU
        ============================== */

        .sidebar-menu {
            margin-bottom: 7px;
        }

        .sidebar-menu a {
            color: rgba(255, 255, 255, 0.88);

            text-decoration: none;

            display: flex;
            align-items: center;

            padding: 13px 14px;

            border-radius: 12px;

            font-size: 15px;
            font-weight: 500;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* ==============================
           MENU ICON
        ============================== */

        .menu-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 10px;

            border-radius: 10px;

            font-size: 18px;

            color: #ffffff;

            background: rgba(255, 255, 255, 0.08);

            transition: all 0.2s ease;
        }


        /* ==============================
           HOVER
        ============================== */

        .sidebar-menu a:hover {
            background: rgba(255, 255, 255, 0.12);

            color: #ffffff;

            transform: translateX(3px);
        }

        .sidebar-menu a:hover .menu-icon {
            background: rgba(255, 255, 255, 0.16);
        }


        /* ==============================
           MENU ACTIVE
        ============================== */

        .sidebar-menu a.active {
            background: #ffffff;

            color: #1e3a8a;

            font-weight: 600;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .sidebar-menu a.active .menu-icon {
            background: #e8efff;

            color: #2563eb;
        }


        /* ==============================
           LOGOUT
        ============================== */

        .logout-menu {
            margin-top: 25px;

            padding-top: 15px;

            border-top:
                1px solid rgba(255, 255, 255, 0.12);
        }

        .logout-menu a:hover {
            background: rgba(239, 68, 68, 0.18);
        }


        /* ==============================
           CONTENT
        ============================== */

        .content {
            padding: 32px;

            min-height: 100vh;
        }


        /* ==============================
           PAGE HEADER
        ============================== */

        .page-title {
            font-size: 30px;
            font-weight: 700;

            color: #111827;

            margin-bottom: 4px;

            letter-spacing: -0.6px;
        }

        .page-subtitle {
            color: #6b7280;

            font-size: 14px;
        }


        /* ==============================
           CARD
        ============================== */

        .card {
            border: 1px solid #e8edf5;

            border-radius: 16px;

            background: #ffffff;

            box-shadow:
                0 4px 15px rgba(15, 23, 42, 0.05);
        }


        /* ==============================
           STAT CARD
        ============================== */

        .stat-card {
            border: none;

            border-radius: 16px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 25px rgba(15, 23, 42, 0.10);
        }

        .stat-label {
            color: #6b7280;

            font-size: 13px;

            font-weight: 500;

            margin-bottom: 8px;
        }

        .stat-number {
            font-size: 30px;

            font-weight: 700;

            color: #111827;

            line-height: 1;
        }

        .stat-icon {
            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            font-size: 20px;
        }

        .stat-icon-blue {
            background: #e8f0ff;
            color: #2563eb;
        }

        .stat-icon-green {
            background: #e7f8ef;
            color: #198754;
        }

        .stat-icon-yellow {
            background: #fff6db;
            color: #d97706;
        }

        .stat-icon-red {
            background: #ffe8eb;
            color: #dc3545;
        }


        /* ==============================
           CARD HEADER
        ============================== */

        .card-header {
            background: #ffffff;

            border-bottom:
                1px solid #edf0f5;

            border-radius: 16px 16px 0 0 !important;

            padding: 18px 20px;
        }

        .card-header h5 {
            font-size: 17px;

            font-weight: 650;

            color: #172033;
        }


        /* ==============================
           TABLE
        ============================== */

        .table {
            margin-bottom: 0;

            vertical-align: middle;
        }

        .table thead th {
            background: #f8fafc;

            color: #475569;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            padding: 13px 12px;

            border-bottom:
                1px solid #e5e7eb;

            white-space: nowrap;
        }

        .table tbody td {
            padding: 13px 12px;

            color: #374151;

            font-size: 14px;

            border-color: #edf0f5;
        }

        .table-hover tbody tr:hover {
            background: #f8fbff;
        }


        /* ==============================
           DASHBOARD TABLE SCROLL
        ============================== */

        .dashboard-table {
            height: 280px;

            overflow-y: auto;

            overflow-x: auto;
        }

        .dashboard-table thead th {
            position: sticky;

            top: 0;

            z-index: 2;
        }


        /* ==============================
           BADGE
        ============================== */

        .badge {
            padding: 6px 10px;

            border-radius: 8px;

            font-size: 11px;

            font-weight: 600;
        }


        /* ==============================
           BUTTON
        ============================== */

        .btn {
            border-radius: 10px;

            font-size: 14px;

            font-weight: 500;

            padding: 9px 16px;
        }

        .btn-primary {
            background: #2563eb;

            border-color: #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;

            border-color: #1d4ed8;
        }


        /* ==============================
           CHART
        ============================== */

        .chart-container {
            position: relative;

            height: 340px;
        }


        /* ==============================
           SCROLLBAR
        ============================== */

        .dashboard-table::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        .dashboard-table::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .dashboard-table::-webkit-scrollbar-thumb {
            background: #cbd5e1;

            border-radius: 10px;
        }

        .dashboard-table::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 768px) {

            .sidebar {
                min-height: auto;

                position: relative;
            }

            .content {
                padding: 20px 15px;
            }

            .sidebar-title {
                padding-bottom: 20px;
            }

            .page-title {
                font-size: 25px;
            }

            .chart-container {
                height: 280px;
            }
        }

    </style>

    {% block head %}
    {% endblock %}

</head>


<body>

<div class="container-fluid">

    <div class="row">

        <!-- ==========================
             SIDEBAR
        =========================== -->

        <div class="col-md-2 sidebar">

            <div class="sidebar-title">
                <i class="bi bi-grid-1x2-fill me-2"></i>
                Inventaris IT
            </div>

            <div class="sidebar-subtitle">
                Management System
            </div>


            <!-- DASHBOARD -->

            <div class="sidebar-menu">

                <a
                    href="/"
                    class="{% if request.path == '/' %}active{% endif %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-house-door"></i>
                    </span>

                    <span>
                        Dashboard
                    </span>

                </a>

            </div>


            <!-- DATA PERANGKAT -->

            <div class="sidebar-menu">

                <a
                    href="/perangkat"
                    class="{% if request.path == '/perangkat' %}active{% endif %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-laptop"></i>
                    </span>

                    <span>
                        Data Perangkat
                    </span>

                </a>

            </div>


            <!-- TAMBAH PERANGKAT -->

            <div class="sidebar-menu">

                <a
                    href="/perangkat/tambah"
                    class="{% if request.path == '/perangkat/tambah' %}active{% endif %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-plus-lg"></i>
                    </span>

                    <span>
                        Tambah Perangkat
                    </span>

                </a>

            </div>


            <!-- CETAK LAPORAN -->

            <div class="sidebar-menu">

                <a
                    href="/perangkat/cetak"
                    class="{% if request.path == '/perangkat/cetak' %}active{% endif %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-printer"></i>
                    </span>

                    <span>
                        Cetak Laporan
                    </span>

                </a>

            </div>


            <!-- EXPORT EXCEL -->

            <div class="sidebar-menu">

                <a
                    href="/perangkat/export"
                    class="{% if request.path == '/perangkat/export' %}active{% endif %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-file-earmark-excel"></i>
                    </span>

                    <span>
                        Export Excel
                    </span>

                </a>

            </div>


            <!-- LOGOUT -->

            <div class="sidebar-menu logout-menu">

                <a href="/logout">

                    <span class="menu-icon">
                        <i class="bi bi-box-arrow-right"></i>
                    </span>

                    <span>
                        Logout
                    </span>

                </a>

            </div>

        </div>


        <!-- ==========================
             CONTENT
        =========================== -->

        <div class="col-md-10 content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>


<!-- ==========================
     SCRIPT
=========================== -->

{% block script %}
{% endblock %}

</body>

</html>
