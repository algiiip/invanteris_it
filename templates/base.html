<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Inventaris IT{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

    <style>

        body {
            background-color: #f5f7fb;
            margin: 0;
        }

        /* SIDEBAR */

.sidebar {
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #0d6efd 0%,
            #4f46e5 50%,
            #6f42c1 100%
        );

    padding: 20px 15px;
}


/* JUDUL SIDEBAR */

.sidebar-title {
    color: #ffffff;
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 30px;
    padding-left: 10px;
}


/* MENU */

.sidebar-menu {
    margin-bottom: 8px;
}


/* TEXT MENU */

.sidebar-menu a {
    color: #ffffff;
    text-decoration: none;

    display: flex;
    align-items: center;

    padding: 14px 16px;

    border-radius: 15px;

    transition: all 0.2s ease;
    
    font-size: 17px;
    font-weight: 500;
}

/* ICON */

.sidebar-menu a .menu-icon {
    width: 30px;
    display: inline-block;

    font-size: 19px;
    text-align: center;
    margin-right: 10px;
}

/* HOVER */

.sidebar-menu a:hover {
    background-color: rgba(255, 255, 255, 0.08);
    color: #ffffff;
    transform: translateX(3px);
}


/* MENU AKTIF */

.sidebar-menu a.active {
    background-color: #031a4c;
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 6px 15px rgba(37, 9, 235, 0.25);
}

        /* CONTENT */
        .content {
            padding: 30px;
            min-height: 100vh;
        }

        /* CARD */
        .stat-card {
            border: none;
            border-radius: 12px;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            transition: 0.2s;
        }

        /* CHART */
        .chart-container {
            position: relative;
            height: 350px;
        }

        /* TABLE */
        .table {
            vertical-align: middle;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .sidebar {
                min-height: auto;
            }

            .content {
                padding: 15px;
            }

        }

    </style>

    {% block head %}
    {% endblock %}

</head>


<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-md-2 sidebar">

            <div class="sidebar-title">
                Inventaris IT
            </div>


            <div class="sidebar-menu">

                <a href="/"
                    class="{% if request.path == '/' %}active{% endif %}"
                >
                    <span class="menu-icon">🏠</span>
                    Dashboard
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat"
                    class="{% if request.path == '/perangkat' %}active{% endif %}"
                >
                    <span class="menu-icon">💻</span>
                    Data Perangkat
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat/tambah"
                    class="{% if request.path == '/perangkat/tambah' %}active{% endif %}"
                >
                    <span class="menu-icon">➕</span>
                    Tambah Perangkat
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat/cetak"
                    class="{% if request.path == '/perangkat/cetak' %}active{% endif %}"
                >
                    <span class="menu-icon">🖨️</span>
                    Cetak Laporan
                </a>

            </div>


            <div class="sidebar-menu">

                <a href="/perangkat/export"
                    class="{% if request.path == '/perangkat/export' %}active{% endif %}"
                >
                    <span class="menu-icon">📊</span>
                    Export Excel
                </a>

            </div>


            <!-- LOGOUT -->

            <div class="sidebar-menu">

                <a href="/logout">
                    <span class="menu-icon">🚪</span>
                    Logout
                </a>

            </div>

        </div>


        <!-- CONTENT -->

        <div class="col-md-10 content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</div>


<!-- SCRIPT -->

{% block script %}
{% endblock %}


</body>

</html>
